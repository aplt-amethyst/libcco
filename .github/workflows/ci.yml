name: CI

on:
  push:
    branches: [main, "feat/**", "feat/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-doc-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check API documentation
        run: bash scripts/check-api-doc.sh

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance --error-exitcode=1 --suppress=missingIncludeSystem --suppress=unusedFunction -I include src/
      - name: Compile each header file independently
        run: bash scripts/check-headers.sh

  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build with ${{ matrix.cc }}
        run: make build CC=${{ matrix.cc }}
      - name: Check symbol isolation
        run: bash scripts/check-symbol-export.sh target/debug/libcco.so

  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - sanitizer: address,undefined
            cc: gcc
          - sanitizer: memory
            cc: clang
    steps:
      - uses: actions/checkout@v4
      - name: Run tests with ${{ matrix.sanitizer }}
        run: make tests SANITIZER=${{ matrix.sanitizer }} CC=${{ matrix.cc }}

  benchmarks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run performance benchmarks
        run: make benchmarks

  coverage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Code coverage
        run: make coverage
